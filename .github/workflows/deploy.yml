name: Deploy Site
on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # ✅ latest stable

      - name: Use Node.js
        uses: actions/setup-node@v4   # ✅ upgrade to v4
        with:
          node-version: 18.9.0

      - name: Install dependencies
        run: npm install
        working-directory: 'source/chandu-cc-tailwind'

      - name: Run Tailwind to generate Site.css
        run: npm run tailwinds
        working-directory: 'source/chandu-cc-tailwind'

      - name: Generate Statiq site
        uses: actions/setup-dotnet@v4   # ✅ upgrade to v4
        with:
          dotnet-version: '6.0.404'
      - run: dotnet run --project ./source/chandu-cc/chandu-cc.csproj -- deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5   # ✅ upgrade to v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3   # ✅ upgrade to v3
        with:
          path: './source/chandu-cc/output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4   # ✅ upgrade to v4
